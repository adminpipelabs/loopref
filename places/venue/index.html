<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue — LoopRef</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#fffdf9;--surface:#fff;--surface-2:#f5f0e8;--surface-3:#ede5d8;
      --ink:#1a1208;--ink-2:#5a4f40;--ink-3:#9a8a78;
      --accent:#ff6b35;--accent-mid:#e55a24;--accent-dim:#ff6b3512;
      --green:#00875a;--green-dim:#00875a12;
      --border:#e8e0d0;--border-2:#d0c4b0;
    }
    html{scroll-behavior:smooth;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}

    /* NAV */
    nav{padding:0 56px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,253,249,0.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
    .logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
    .back-link{font-size:13px;color:var(--ink-2);text-decoration:none;font-weight:500;display:flex;align-items:center;gap:6px;transition:color .15s;}
    .back-link:hover{color:var(--ink);}

    .page{max-width:900px;margin:0 auto;padding:48px 56px 80px;}

    /* HERO PHOTO */
    .venue-hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:32px;}
    .photo-strip{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:240px;gap:4px;}
    .photo-strip .main{grid-row:1/3;}
    .photo-slot{background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;}
    .photo-slot img{width:100%;height:100%;object-fit:cover;}

    /* VENUE INFO */
    .venue-info{margin-bottom:40px;}
    .venue-cuisine{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:8px;}
    .venue-name{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin-bottom:10px;color:var(--ink);}
    .venue-tagline{font-size:15px;color:var(--ink-2);line-height:1.7;margin-bottom:16px;max-width:600px;}
    .venue-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-3);}
    .venue-meta span{display:flex;align-items:center;gap:5px;}
    .venue-meta a{color:inherit;text-decoration:none;}
    .venue-meta a:hover{color:var(--ink);}

    /* SOCIAL LINKS */
    .social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
    .social-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:600;transition:all .15s;}
    .social-btn:hover{border-color:var(--accent);color:var(--accent);}
    .social-btn svg{width:14px;height:14px;}

    /* INFO CARD */
    .info-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:32px;}
    .info-card-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:16px;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .info-item{padding:14px;background:var(--surface-2);border-radius:8px;}
    .info-item-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
    .info-item-value{font-size:15px;font-weight:700;color:var(--ink);}

    /* HOW IT WORKS */
    .steps{margin-bottom:40px;}
    .steps h2{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-bottom:20px;letter-spacing:-0.5px;}
    .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .step{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
    .step-num{width:32px;height:32px;border-radius:50%;background:var(--accent-dim);border:1px solid #ff6b3525;color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
    .step h3{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
    .step p{font-size:12px;color:var(--ink-2);line-height:1.6;}

    /* GALLERY */
    .gallery{margin-bottom:40px;}
    .gallery h2{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-bottom:16px;letter-spacing:-0.5px;}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
    .gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);}
    .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s;}
    .gallery-item:hover img{transform:scale(1.05);}

    /* NOT FOUND */
    .not-found{text-align:center;padding:100px 24px;color:var(--ink-3);}
    .not-found h2{font-family:'Fraunces',serif;font-size:28px;color:var(--ink);margin-bottom:12px;}
    .not-found a{color:var(--accent);text-decoration:none;font-weight:600;}

    /* OFFER BADGE (active venues only) */
    .venue-offer{background:var(--green-dim);border:1px solid #00875a25;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--ink-2);}
    .venue-offer-pct{font-weight:800;color:var(--green);font-size:16px;}

    /* REFERRAL BANNER */
    .ref-banner{background:var(--accent-dim);border:1px solid #ff6b3525;border-radius:10px;padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--accent);font-weight:600;}
    .ref-banner svg{width:18px;height:18px;stroke:var(--accent);fill:none;flex-shrink:0;}

    /* SHARE CARD */
    .share-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:40px;}
    .share-card h2{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-0.5px;}
    .share-card p{font-size:13px;color:var(--ink-2);margin-bottom:20px;line-height:1.6;}
    .share-form{display:flex;gap:10px;margin-bottom:0;}
    .share-form input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);outline:none;}
    .share-form input:focus{border-color:var(--accent);}
    .share-form button{padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;transition:background .15s;}
    .share-form button:hover{background:var(--accent-mid);}
    .share-result{margin-top:20px;display:none;}
    .share-url-row{display:flex;gap:8px;margin-bottom:14px;}
    .share-url-row input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);color:var(--ink);outline:none;}
    .share-url-row button{padding:11px 16px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .15s;}
    .share-url-row button:hover{background:var(--ink-2);}
    .share-channels{display:flex;gap:10px;flex-wrap:wrap;}
    .share-ch-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
    .share-ch-btn:hover{border-color:var(--accent);color:var(--accent);}
    .share-ch-btn svg{width:16px;height:16px;flex-shrink:0;}
    .share-hint{font-size:11px;color:var(--ink-3);margin-top:12px;}

    /* FOOTER */
    .powered{text-align:center;font-size:12px;color:var(--ink-3);padding:32px 0 16px;border-top:1px solid var(--border);}
    .powered a{color:var(--accent);text-decoration:none;font-weight:600;}

    @media(max-width:700px){
      nav{padding:0 20px;}
      .page{padding:32px 20px 60px;}
      .photo-strip{grid-template-columns:1fr;grid-template-rows:200px;}
      .photo-strip .side{display:none;}
      .info-grid{grid-template-columns:1fr;}
      .steps-grid{grid-template-columns:1fr;}
      .share-form{flex-direction:column;}
      .share-channels{flex-direction:column;}
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">
    <img src="/logo.svg" alt="LoopRef" height="36">
  </a>
  <a class="back-link" href="/places">&larr; All venues</a>
</nav>

<div class="page" id="page-content">
  <div style="text-align:center;padding:80px;color:var(--ink-3)">Loading venue...</div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug') || params.get('id');

  if (!slug) {
    document.getElementById('page-content').innerHTML = notFoundHtml('No venue specified.');
  } else {
    loadVenue(slug);
  }

  async function loadVenue(slug) {
    try {
      var res = await fetch('/api/places/' + slug);
      if (!res.ok) throw new Error('not found');
      var v = await res.json();
      renderVenue(v);
      document.title = v.name + ' — LoopRef';
    } catch(e) {
      document.getElementById('page-content').innerHTML = notFoundHtml("We couldn't find that venue.");
    }
  }

  function renderVenue(v) {
    var photos = v.photos || [];
    var mainPhoto = photos[0];
    var side1 = photos[1];
    var side2 = photos[2];
    var emoji = cuisineEmoji(v.cuisine);

    var photoStripHtml =
      '<div class="photo-strip">' +
        '<div class="photo-slot main">' +
          (mainPhoto ? '<img src="' + mainPhoto.photo_url + '" alt="' + v.name + '">' : emoji) +
        '</div>' +
        '<div class="photo-slot side">' +
          (side1 ? '<img src="' + side1.photo_url + '" alt="' + (side1.dish_name || v.name) + '">' : '') +
        '</div>' +
        '<div class="photo-slot side">' +
          (side2 ? '<img src="' + side2.photo_url + '" alt="' + (side2.dish_name || v.name) + '">' : '') +
        '</div>' +
      '</div>';

    var galleryPhotos = photos.slice(3);
    var galleryHtml = '';
    if (galleryPhotos.length) {
      galleryHtml = '<div class="gallery"><h2>More photos</h2><div class="gallery-grid">' +
        galleryPhotos.map(function(p) {
          return '<div class="gallery-item"><img src="' + p.photo_url + '" alt="' + (p.dish_name || v.name) + '" loading="lazy"></div>';
        }).join('') +
        '</div></div>';
    }

    var websiteLink = v.website ? '<a class="social-btn" href="' + v.website + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Website</a>' : '';
    var igLink = v.instagram_handle ? '<a class="social-btn" href="https://instagram.com/' + v.instagram_handle.replace('@','') + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>@' + v.instagram_handle.replace('@','') + '</a>' : '';

    // Referral banner if ?ref= present
    var refCode = params.get('ref');
    var refBannerHtml = refCode
      ? '<div class="ref-banner"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>A friend invited you to check out ' + v.name + '!</div>'
      : '';

    document.getElementById('page-content').innerHTML =
      refBannerHtml +

      '<div class="venue-hero">' + photoStripHtml + '</div>' +

      '<div class="venue-info">' +
        (v.cuisine ? '<span class="venue-cuisine">' + v.cuisine + '</span>' : '') +
        '<h1 class="venue-name">' + v.name + '</h1>' +
        (v.tagline ? '<p class="venue-tagline">' + v.tagline + '</p>' : '') +
        (v.status === 'active' ? '<div class="venue-offer"><span class="venue-offer-pct">' + (v.discount_pct || 20) + '% off</span> when you spend $' + (v.min_spend || 50) + '+ and share with friends</div>' : '') +
        '<div class="venue-meta">' +
          (v.city ? '<span>&#128205; ' + v.city + (v.state ? ', ' + v.state : '') + '</span>' : '') +
          (v.address ? '<span>' + v.address + '</span>' : '') +
          (v.phone ? '<span><a href="tel:' + v.phone + '">' + v.phone + '</a></span>' : '') +
        '</div>' +
        '<div class="social-row">' + websiteLink + igLink + '</div>' +
      '</div>' +

      '<div class="steps">' +
        '<h2>How <em>LoopRef</em> works</h2>' +
        '<div class="steps-grid">' +
          '<div class="step"><div class="step-num">1</div><h3>Visit &amp; enjoy</h3><p>Head to ' + v.name + ' and enjoy your meal or experience.</p></div>' +
          '<div class="step"><div class="step-num">2</div><h3>Share with friends</h3><p>Get your share link below and send it to 5+ friends via WhatsApp, text, or social media.</p></div>' +
          '<div class="step"><div class="step-num">3</div><h3>Friends discover</h3><p>Your friends click your link, discover ' + v.name + ', and visit too.</p></div>' +
        '</div>' +
      '</div>' +

      '<div class="share-card" id="share-card">' +
        '<h2>Share <em>' + v.name + '</em></h2>' +
        '<p>Enjoyed your visit? Share with friends and help them discover this place.</p>' +
        '<div class="share-form" id="share-form">' +
          '<input type="text" id="sharer-name" placeholder="Your first name (optional)">' +
          '<button onclick="generateShareLink(' + v.id + ')">Get your share link</button>' +
        '</div>' +
        '<div class="share-result" id="share-result">' +
          '<div class="share-url-row">' +
            '<input type="text" id="share-url" readonly>' +
            '<button onclick="copyShareLink()">Copy</button>' +
          '</div>' +
          '<div class="share-channels" id="share-channels"></div>' +
          '<div class="share-hint">Share with 5+ friends to spread the word!</div>' +
        '</div>' +
      '</div>' +

      galleryHtml +

      '<div class="powered">' +
        'Powered by <a href="/">LoopRef</a> &middot; ' +
        '<a href="/places">Browse all venues</a> &middot; ' +
        '<a href="/register">List your venue</a>' +
      '</div>';

    // Store venue data for share functions
    window._venue = v;
  }

  function notFoundHtml(msg) {
    return '<div class="not-found">' +
      '<div style="font-size:48px;margin-bottom:16px">&#128269;</div>' +
      '<h2>Venue not found</h2>' +
      '<p>' + msg + '</p>' +
      '<a href="/places" style="display:inline-block;margin-top:24px">&larr; Back to directory</a>' +
    '</div>';
  }

  // ─── Share functions ──────────────────────────────────────────────────────

  var currentShareUrl = '';

  function generateShareLink(restaurantId) {
    var name = document.getElementById('sharer-name').value.trim();
    var btn = document.querySelector('#share-form button');
    btn.textContent = 'Generating...';
    btn.disabled = true;

    fetch('/api/share', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ restaurantId: restaurantId, sharerName: name || null })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.ok) throw new Error(data.error);
      currentShareUrl = data.shareUrl;
      document.getElementById('share-url').value = currentShareUrl;
      document.getElementById('share-form').style.display = 'none';
      document.getElementById('share-result').style.display = 'block';

      var v = window._venue;
      var msg = (name ? name + ' recommends ' : 'Check out ') + v.name + (v.city ? ' in ' + v.city : '') + '! ' + currentShareUrl;

      var channels = document.getElementById('share-channels');
      var encodedMsg = encodeURIComponent(msg);
      var encodedUrl = encodeURIComponent(currentShareUrl);
      channels.innerHTML =
        '<a class="share-ch-btn" href="https://wa.me/?text=' + encodedMsg + '" target="_blank">' +
          '<svg viewBox="0 0 24 24" fill="#25d366" stroke="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.821.487 3.53 1.338 5L2 22l5.112-1.328C8.44 21.516 10.185 22 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>' +
          'WhatsApp</a>' +
        '<a class="share-ch-btn" href="https://www.instagram.com/" target="_blank">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="#E4405F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>' +
          'Instagram</a>' +
        '<a class="share-ch-btn" href="https://www.tiktok.com/" target="_blank">' +
          '<svg viewBox="0 0 24 24" fill="#000"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.65a8.16 8.16 0 0 0 4.77 1.52V6.72a4.85 4.85 0 0 1-1-.03z"/></svg>' +
          'TikTok</a>' +
        '<a class="share-ch-btn" href="https://www.snapchat.com/" target="_blank">' +
          '<svg viewBox="0 0 24 24" fill="#FFFC00" stroke="#333" stroke-width="0.5"><path d="M12.017 2C9.31 2 7.05 4.05 7.05 6.56c0 .21.01.42.04.62l-.57.03c-.51 0-.97.26-.97.69 0 .37.3.69.8.69h.16c-.08.28-.12.58-.12.89 0 2.04 1.65 4.2 3.9 5.02-.05.12-.16.23-.33.3-.41.18-1.17.3-2.15.49-.45.09-.73.51-.64.96.12.54 1.54 1.27 4.86 1.27s4.74-.73 4.85-1.27c.09-.45-.19-.87-.64-.96-.98-.2-1.74-.31-2.15-.5-.17-.07-.28-.18-.33-.3 2.25-.82 3.9-2.98 3.9-5.02 0-.31-.04-.6-.12-.89h.16c.5 0 .8-.32.8-.69 0-.43-.46-.69-.97-.69l-.57-.03c.03-.2.04-.41.04-.62C16.98 4.05 14.72 2 12.02 2z"/></svg>' +
          'Snapchat</a>' +
        '<a class="share-ch-btn" href="https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl + '" target="_blank">' +
          '<svg viewBox="0 0 24 24" fill="#1877F2" stroke="none"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>' +
          'Facebook</a>' +
        '<a class="share-ch-btn" href="https://pinterest.com/pin/create/button/?url=' + encodedUrl + '&description=' + encodedMsg + '" target="_blank">' +
